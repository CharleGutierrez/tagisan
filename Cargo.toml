[package]
name = "tagisan"
version = "0.2.0"
edition = "2021"
description = "High-performance Multi-LLM Collaboration, Adversarial Debate & Mixture-of-Agents Engine in Rust"
authors = ["Charle Gutierrez"]
default-run = "tgs"

[lib]
name = "tagisan"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tgs"
path = "src/bin/tgs.rs"

[[bin]]
name = "tagisan"
path = "src/bin/tagisan.rs"

[dependencies]
blake3 = "1.5"
chrono = "0.4"
# Async Runtime & Concurrency
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# HTTP Client & Streaming
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"

# Serialization & Error Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
memmap2 = "0.9"
rayon = "1.12"
toml = "0.8"
thiserror = "2.0"
bitflags = { version = "2.8", features = ["serde"] }
petgraph = { version = "0.7", features = ["serde-1"] }
base64 = "0.22"

# CLI, Configuration & UI
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
colored = "2.1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.29", features = ["bundled"] }
libc = "0.2.189"

# Vella Framework Integration & FHE Shield
vella = { path = "../Vella", optional = true }
tfhe = { version = "1.7.0", features = ["boolean", "integer", "shortint"], optional = true }

# Phase 1+2: Pluggable Vector Backends
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json"], optional = true }

# Phase 3+4: OpenTelemetry Engine
opentelemetry = { version = "0.27", optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.27", optional = true }

# Phase 6: WASM Tool Sandbox
wasmtime = { version = "27", optional = true }

[features]
default = []
vella = ["dep:vella", "tfhe"]
tfhe = ["dep:tfhe"]
pgvector = ["dep:sqlx"]
qdrant = []
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
wasm-sandbox = ["dep:wasmtime"]
