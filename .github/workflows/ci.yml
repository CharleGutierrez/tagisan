name: Tagisan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Compilation
        run: cargo check --bin tgs --bin tagisan --no-default-features

      - name: Run Brutal Verification Test Suites
        run: |
          cargo test --test vibe_math_skills_brutal_tests --no-default-features
          cargo test --test quant_foundation_skills_brutal_tests --no-default-features
          cargo test --test skills_brutal_verification_tests --no-default-features
