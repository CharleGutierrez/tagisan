name: Release & Package Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: tgs
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: tgs
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: tgs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --bin tgs

      - name: Package Release Archive
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_DIR="tgs-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$ARCHIVE_DIR/"
          cp README.md LICENSE "$ARCHIVE_DIR/" 2>/dev/null || true
          tar -czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgs-${{ matrix.target }}
          path: tgs-*.tar.gz*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/tgs-*.tar.gz*
          generate_release_notes: true
