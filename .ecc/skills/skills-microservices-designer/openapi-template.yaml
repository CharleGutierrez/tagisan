# File: output/swagger/{service}-openapi.yaml
# Generated by skills-microservices-designer
# Derived from: spec.md, plan.md, Neo4j graph evidence

openapi: 3.0.3
info:
  title: "{{service_name}} API"
  description: "{{service_description}}"
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@example.com

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://api-staging.example.com/v1
    description: Staging server

# Mandatory NFR: JWT Security applied globally
security:
  - BearerAuth: []

tags:
  - name: "{{service_name}}"
    description: "{{service_description}}"
  - name: Health
    description: Service health endpoints

paths:
  # ── Business Endpoints (derived from spec.md + plan.md + graph method signatures) ──

  "{{path}}":
    "{{method}}":
      summary: "{{summary}}"           # from graphEvidence.methods[*].description or plan.md
      description: |
        {{description}}

        **Status**: {{status}}         # Existing | Proposed
        **Spec Kit source**: spec.md §{{spec_section}}

        **Evidence**:
        {{#evidence_sources}}
        - {{source}}: {{reference}}
        {{/evidence_sources}}

      operationId: "{{operation_id}}"  # from graphEvidence.methods[*].signature
      tags:
        - "{{service_name}}"

      security:
        - BearerAuth: []

      parameters:
        # Mandatory NFR: Correlation ID
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Correlation ID for distributed request tracing

        # Path / query parameters (from plan.md API contracts)
        # {{#path_parameters}}
        # - name: {{name}}
        #   in: path
        #   required: true
        #   schema:
        #     type: {{type}}
        # {{/path_parameters}}

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/{{request_schema}}"

      responses:
        "200":
          description: "{{success_description}}"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: Correlation ID echoed from request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/{{response_schema}}"
        # 400/422 scenarios derived from graphEvidence.classRules[*].businessRules
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

      # Mandatory NFR: Timeout
      x-timeout-ms: 10000

      # Mandatory NFR: Retry
      x-retry-policy:
        max-attempts: 3
        backoff-strategy: exponential
        initial-delay-ms: 1000
        max-delay-ms: 5000

      # Mandatory NFR: Structured logging
      x-logging:
        level: INFO
        format: structured-json
        include-request-body: false
        include-response-body: false

      # Mandatory NFR: Audit
      x-audit:
        enabled: true
        capture-user: true
        capture-timestamp: true

      # Add x-circuit-breaker only when graphEvidence.boundedContext.recommendation = CONSIDER
      # x-circuit-breaker:
      #   threshold: 50
      #   duration-ms: 60000

  # ── Mandatory NFR: Health Endpoints ──────────────────────────────────────────

  /health/live:
    get:
      summary: Liveness probe
      description: Indicates if the service process is running
      operationId: getLiveness
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      x-timeout-ms: 1000

  /health/ready:
    get:
      summary: Readiness probe
      description: Indicates if the service is ready to accept traffic
      operationId: getReadiness
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready
      x-timeout-ms: 1000

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token — mandatory on all business endpoints

  schemas:
    # ── Business schemas (derived from plan.md data model + graph column nodes) ──
    "{{SchemaName}}":
      type: object
      required:
        - "{{required_field}}"
      properties:
        "{{field_name}}":
          type: "{{field_type}}"
          format: "{{field_format}}"
          description: "{{field_description}}"
      x-evidence:
        - source: "{{evidence_file}}"
          reference: "{{evidence_reference}}"

    # ── Mandatory: Standard schemas ──────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [code, message, correlationId, timestamp]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: object

  responses:
    BadRequest:
      description: Bad request — validation failure
      headers:
        X-Correlation-ID:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized — invalid or missing JWT token
      headers:
        X-Correlation-ID:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnprocessableEntity:
      description: Unprocessable entity — business rule violation
      headers:
        X-Correlation-ID:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      headers:
        X-Correlation-ID:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# Mandatory: Evidence traceability
x-evidence-sources:
  - file: "{{evidence_file}}"
    sections: ["{{sections}}"]
    relevance: "{{relevance}}"

# Open questions (unclear ownership or boundary stability)
x-open-questions:
  - question: "{{question}}"
    context: "{{context}}"
    impact: "{{impact}}"
